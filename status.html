<!DOCTYPE html>
<html>
<head>
    <title>Flight Status</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #1e3c72, #2a5298);
            margin: 0;
            padding: 0;
        }

        .container {
            width: 40%;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            text-align: center;
        }

        h2 {
            color: #1e3c72;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
            box-shadow: 0 0 5px rgba(42,82,152,0.3);
        }

        button {
            width: 95%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(to right, #2a5298, #1e3c72);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: linear-gradient(to right, #1e3c72, #16325c);
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            background: #f4f7fc;
            border-left: 5px solid #2a5298;
            font-weight: bold;
            color: #1e3c72;
        }

        .error {
            margin-top: 20px;
            color: red;
            font-weight: bold;
        }

        a {
            display: block;
            margin-top: 20px;
            color: #1e3c72;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>✈️ Check Flight Status</h2>

    <form method="POST">
        <input name="airline" placeholder="Airline" required>
        <input name="flight_num" placeholder="Flight Number" required>
        <button type="submit">Check Status</button>
    </form>

    {% if result %}
        <div class="result">
            Status: {{ result.real_status }}
        </div>
    {% elif error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <a href="/home">← Back</a>

</div>

</body>
</html>
